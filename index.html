<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="習慣トラッカー" />
    <title>中村ぽんた>中村>中村>>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const Plus = () => (
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
        >
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      );

      const X = () => (
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      );

      const ChevronLeft = () => (
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
        >
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      );

      const ChevronRight = () => (
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
        >
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      );

      const HabitTracker = () => {
        const [habits, setHabits] = useState([]);
        const [newHabitName, setNewHabitName] = useState("");
        const [viewMode, setViewMode] = useState("week");
        const [currentDate, setCurrentDate] = useState(new Date());

        // ローカルストレージから読み込み
        useEffect(() => {
          const saved = localStorage.getItem("habits");
          if (saved) {
            setHabits(JSON.parse(saved));
          }
        }, []);

        // ローカルストレージに保存
        useEffect(() => {
          if (habits.length > 0) {
            localStorage.setItem("habits", JSON.stringify(habits));
          }
        }, [habits]);

        const addHabit = () => {
          if (newHabitName.trim()) {
            setHabits([
              ...habits,
              { id: Date.now(), name: newHabitName, completions: {} },
            ]);
            setNewHabitName("");
          }
        };

        const removeHabit = (id) => {
          setHabits(habits.filter((habit) => habit.id !== id));
        };

        const toggleCompletion = (habitId, dateStr) => {
          setHabits(
            habits.map((habit) => {
              if (habit.id === habitId) {
                const newCompletions = { ...habit.completions };
                if (newCompletions[dateStr]) {
                  delete newCompletions[dateStr];
                } else {
                  newCompletions[dateStr] = true;
                }
                return { ...habit, completions: newCompletions };
              }
              return habit;
            })
          );
        };

        const dateToString = (date) => {
          return date.toISOString().split("T")[0];
        };

        const getWeekDates = (date) => {
          const week = [];
          const current = new Date(date);
          const day = current.getDay();
          const diff = current.getDate() - day;

          for (let i = 0; i < 7; i++) {
            const d = new Date(current);
            d.setDate(diff + i);
            week.push(d);
          }
          return week;
        };

        const getMonthDates = (date) => {
          const year = date.getFullYear();
          const month = date.getMonth();
          const firstDay = new Date(year, month, 1);
          const lastDay = new Date(year, month + 1, 0);
          const dates = [];

          for (
            let d = new Date(firstDay);
            d <= lastDay;
            d.setDate(d.getDate() + 1)
          ) {
            dates.push(new Date(d));
          }
          return dates;
        };

        const dates =
          viewMode === "week"
            ? getWeekDates(currentDate)
            : getMonthDates(currentDate);

        const navigatePrev = () => {
          const newDate = new Date(currentDate);
          if (viewMode === "week") {
            newDate.setDate(newDate.getDate() - 7);
          } else {
            newDate.setMonth(newDate.getMonth() - 1);
          }
          setCurrentDate(newDate);
        };

        const navigateNext = () => {
          const newDate = new Date(currentDate);
          if (viewMode === "week") {
            newDate.setDate(newDate.getDate() + 7);
          } else {
            newDate.setMonth(newDate.getMonth() + 1);
          }
          setCurrentDate(newDate);
        };

        const navigateToday = () => {
          setCurrentDate(new Date());
        };

        const calculateCompletionRate = (habit) => {
          const completed = dates.filter(
            (date) => habit.completions[dateToString(date)]
          ).length;
          return Math.round((completed / dates.length) * 100);
        };

        const calculateStreak = (habit) => {
          let streak = 0;
          const today = new Date();
          today.setHours(0, 0, 0, 0);

          for (let i = 0; i < 365; i++) {
            const checkDate = new Date(today);
            checkDate.setDate(checkDate.getDate() - i);
            const dateStr = dateToString(checkDate);

            if (habit.completions[dateStr]) {
              streak++;
            } else {
              break;
            }
          }
          return streak;
        };

        return (
          <div className="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 p-4 md:p-8">
            <div className="max-w-6xl mx-auto">
              <div className="mb-8 md:mb-12">
                <h1 className="text-3xl md:text-5xl font-bold mb-2 text-gray-900 tracking-tight">
                  習慣トラッカー
                </h1>
                <p className="text-sm md:text-base text-gray-600">
                  ぽんたの積み重ね
                </p>
              </div>

              <div className="mb-6 md:mb-8 flex gap-2 md:gap-3">
                <input
                  type="text"
                  value={newHabitName}
                  onChange={(e) => setNewHabitName(e.target.value)}
                  onKeyPress={(e) => e.key === "Enter" && addHabit()}
                  placeholder="新しい習慣を追加..."
                  className="flex-1 px-4 md:px-5 py-2 md:py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-400 focus:border-transparent bg-white shadow-sm text-sm md:text-base"
                />
                <button
                  onClick={addHabit}
                  className="px-4 md:px-6 py-2 md:py-3 bg-gray-900 text-white rounded-lg hover:bg-gray-800 flex items-center gap-2 shadow-md transition-all hover:shadow-lg text-sm md:text-base"
                >
                  <Plus />
                  <span className="hidden md:inline">追加</span>
                </button>
              </div>

              <div className="mb-6 md:mb-8 flex flex-col md:flex-row items-stretch md:items-center justify-between bg-white p-3 md:p-4 rounded-lg shadow-sm gap-3 md:gap-0">
                <div className="flex gap-2">
                  <button
                    onClick={() => setViewMode("week")}
                    className={`flex-1 md:flex-none px-4 md:px-5 py-2 rounded-lg font-medium transition-all text-sm md:text-base ${
                      viewMode === "week"
                        ? "bg-gray-900 text-white shadow-md"
                        : "bg-gray-100 text-gray-700 hover:bg-gray-200"
                    }`}
                  >
                    週間
                  </button>
                  <button
                    onClick={() => setViewMode("month")}
                    className={`flex-1 md:flex-none px-4 md:px-5 py-2 rounded-lg font-medium transition-all text-sm md:text-base ${
                      viewMode === "month"
                        ? "bg-gray-900 text-white shadow-md"
                        : "bg-gray-100 text-gray-700 hover:bg-gray-200"
                    }`}
                  >
                    月間
                  </button>
                </div>

                <div className="flex items-center justify-between md:gap-4">
                  <button
                    onClick={navigatePrev}
                    className="p-2 hover:bg-gray-100 rounded-lg transition-colors"
                  >
                    <ChevronLeft />
                  </button>
                  <button
                    onClick={navigateToday}
                    className="px-3 md:px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition-colors text-sm md:text-base"
                  >
                    今日
                  </button>
                  <span className="font-semibold text-sm md:text-lg text-center text-gray-900 min-w-[140px] md:min-w-[200px]">
                    {viewMode === "week"
                      ? `${dates[0].getMonth() + 1}/${dates[0].getDate()} - ${
                          dates[6].getMonth() + 1
                        }/${dates[6].getDate()}`
                      : `${currentDate.getFullYear()}年${
                          currentDate.getMonth() + 1
                        }月`}
                  </span>
                  <button
                    onClick={navigateNext}
                    className="p-2 hover:bg-gray-100 rounded-lg transition-colors"
                  >
                    <ChevronRight />
                  </button>
                </div>
              </div>

              {habits.length === 0 ? (
                <div className="text-center py-16 md:py-20 bg-white rounded-lg shadow-sm">
                  <div className="text-gray-400 text-base md:text-lg mb-2">
                    まだ習慣が登録されていません
                  </div>
                  <div className="text-gray-500 text-sm">
                    習慣を追加して記録を始めましょう
                  </div>
                </div>
              ) : (
                <div className="space-y-4 md:space-y-5">
                  {habits.map((habit) => (
                    <div
                      key={habit.id}
                      className="bg-white rounded-lg shadow-md p-4 md:p-6 hover:shadow-lg transition-shadow"
                    >
                      <div className="flex flex-col md:flex-row md:items-center justify-between mb-4 md:mb-5 gap-3 md:gap-0">
                        <div className="flex flex-col md:flex-row md:items-center gap-2 md:gap-6">
                          <h3 className="text-xl md:text-2xl font-bold text-gray-900">
                            {habit.name}
                          </h3>
                          <div className="flex gap-2 md:gap-4 text-xs md:text-sm">
                            <span className="px-2 md:px-3 py-1 bg-gray-100 rounded-full text-gray-700 font-medium">
                              🔥 連続 {calculateStreak(habit)}日
                            </span>
                            <span className="px-2 md:px-3 py-1 bg-gray-100 rounded-full text-gray-700 font-medium">
                              📊 達成率 {calculateCompletionRate(habit)}%
                            </span>
                          </div>
                        </div>
                        <button
                          onClick={() => removeHabit(habit.id)}
                          className="self-end md:self-auto p-2 hover:bg-gray-100 rounded-lg transition-colors text-gray-500 hover:text-gray-700"
                        >
                          <X />
                        </button>
                      </div>

                      <div className="grid gap-1.5 md:gap-2 grid-cols-7">
                        {dates.map((date, index) => {
                          const dateStr = dateToString(date);
                          const isCompleted = habit.completions[dateStr];
                          const isToday = dateToString(new Date()) === dateStr;

                          return (
                            <button
                              key={index}
                              onClick={() =>
                                toggleCompletion(habit.id, dateStr)
                              }
                              className={`aspect-square rounded-lg flex flex-col items-center justify-center transition-all hover:scale-105 ${
                                isCompleted
                                  ? "bg-gray-900 text-white shadow-md"
                                  : "bg-gray-50 text-gray-700 hover:bg-gray-100"
                              } ${
                                isToday
                                  ? "ring-2 ring-gray-400 ring-offset-2"
                                  : ""
                              }`}
                            >
                              <div className="text-[10px] md:text-xs font-medium">
                                {date.getMonth() + 1}/{date.getDate()}
                              </div>
                              <div className="text-[9px] md:text-xs opacity-70">
                                {
                                  ["日", "月", "火", "水", "木", "金", "土"][
                                    date.getDay()
                                  ]
                                }
                              </div>
                              {isCompleted && (
                                <div className="text-sm md:text-lg mt-0.5 md:mt-1">
                                  ✓
                                </div>
                              )}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      };

      ReactDOM.render(<HabitTracker />, document.getElementById("root"));
    </script>
  </body>
</html>
